<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#primaryGrad)" filter="url(#shadow)" />
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#glowGrad)" />

  <!-- Code Bracket Left < -->
  <path d="M 38 46 L 27 60 L 38 74" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Letter J -->
  <path d="M 68 44 V 71 C 68 77 64 81 57 81 C 51 81 48 77 48 73" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dot above J / Modern accent dot -->
  <circle cx="68" cy="36" r="4.5" fill="#38bdf8" />

  <!-- Code Bracket Right > -->
  <path d="M 82 46 L 93 60 L 82 74" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
</svg>
